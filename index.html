<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14181f">
<meta name="description" content="Planejamento e Controle Semanal de tarefas de obra (PCP): previsto × executado, prioridades e avanço da obra.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgcng9Ijk2IiBmaWxsPSIjMTQxODFmIi8+PHJlY3QgeD0iOTYiIHk9Ijk2IiB3aWR0aD0iMzIwIiBoZWlnaHQ9IjMyMCIgcng9IjY0IiBmaWxsPSIjZjJhOTAwIi8+PHRleHQgeD0iMjU2IiB5PSIzMDAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJBcmlhbCwgSGVsdmV0aWNhLCBzYW5zLXNlcmlmIiBmb250LXdlaWdodD0iNzAwIiBmb250LXNpemU9IjExOCIgZmlsbD0iIzE0MTgxZiI+UENQPC90ZXh0Pjwvc3ZnPgo=" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>PCP – Planejamento e Controle Semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --ink: #1b2130;
    --ink-2: #4a5263;
    --ink-3: #8a91a0;
    --line: #dfe2e8;
    --line-2: #eceef2;
    --bg: #f4f5f7;
    --card: #ffffff;
    --head: #14181f;
    --amber: #f2a900;
    --amber-soft: #fff4d6;
    --p: #2f63c9;
    --p-soft: #dbe6fb;
    --e: #23905a;
    --e-soft: #d5f0e1;
    --rain: #3a7bd5;
    --rain-soft: #e1ecfb;
    --sat: #f3f4f6;
    --danger: #c23b30;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Outfit', system-ui, sans-serif; font-size: 14px; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }

  /* barra superior */
  .topbar { background: var(--head); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .02em; }
  .brand .mark { width: 30px; height: 30px; border-radius: 7px; background: var(--amber); color: var(--head); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .brand small { display: block; font-weight: 400; color: #aab1bf; font-size: 12px; letter-spacing: 0; }
  .status { margin-left: auto; font-size: 12px; color: #aab1bf; display: flex; align-items: center; gap: 6px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #5bc98a; }
  .status.saving .dot { background: var(--amber); }
  .status.warn .dot { background: #e5675c; }

  .toolbar { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 500; }
  select, .input { height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: #fff; min-width: 200px; }
  select:focus, .input:focus { outline: 2px solid var(--amber); outline-offset: -1px; border-color: transparent; }
  .btn { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover { background: #f7f8fa; }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: var(--head); }
  .btn.primary:hover { filter: brightness(.96); }
  .btn.dark { background: var(--head); border-color: var(--head); color: #fff; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .spacer { flex: 1; }
  .menu-wrap { position: relative; }
  .menu { position: absolute; right: 0; top: 40px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(20,24,31,.12); padding: 6px; min-width: 220px; z-index: 30; display: none; }
  .menu.open { display: block; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 6px; }
  .menu button:hover { background: var(--bg); }
  .menu hr { border: 0; border-top: 1px solid var(--line-2); margin: 4px 0; }

  main { padding: 18px 20px 40px; }
  .sheet { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .sheet-title { background: var(--head); color: #fff; text-align: center; font-weight: 600; letter-spacing: .08em; padding: 10px; font-size: 15px; }
  .sheet-info { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); align-items: start; }
  .info-lines { display: flex; flex-direction: column; gap: 8px; }
  .info-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .info-line b { font-weight: 600; font-size: 12px; letter-spacing: .06em; color: var(--ink-2); min-width: 92px; }
  .info-line .val { font-size: 16px; font-weight: 500; }
  .info-line input[type=date] { height: 32px; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chip { display: inline-grid; place-items: center; min-width: 24px; height: 20px; padding: 0 5px; border-radius: 5px; font-size: 11px; font-weight: 600; }
  .chip.s { background: var(--amber-soft); color: #8a6100; }
  .chip.ch { background: var(--rain-soft); color: var(--rain); }
  .chip.p { background: var(--p); color: #fff; }
  .chip.e { background: var(--e); color: #fff; }
  .kpis { display: flex; gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 150px; }
  .kpi .k { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
  .kpi .v { font-size: 24px; font-weight: 600; margin-top: 2px; }
  .kpi .s { font-size: 12px; color: var(--ink-2); }
  .bar { height: 5px; background: var(--line-2); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--e); }

  /* grade */
  .grid-wrap { overflow-x: auto; }
  table.grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: max(100%, 1560px); }
  .grid th, .grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; text-align: center; vertical-align: middle; }
  .grid thead th { background: #fafbfc; font-size: 11px; font-weight: 600; color: var(--ink-2); letter-spacing: .05em; }
  .grid thead th.big { font-size: 12px; text-transform: uppercase; }
  .grid thead th.week { background: var(--head); color: #fff; padding: 7px 4px; font-size: 12px; }
  .grid thead th.week small { color: #aab1bf; font-weight: 400; margin-left: 6px; letter-spacing: 0; }
  .grid .lbl { width: 26px; font-size: 11px; font-weight: 600; color: var(--ink-3); background: #fafbfc; }
  .grid .day { width: 38px; }
  .grid .pct { width: 66px; }
  .grid thead .dayhead { padding: 4px 0; line-height: 1.15; }
  .grid thead .dayhead .n { display: block; font-size: 13px; color: var(--ink); font-weight: 600; }
  .grid .sat { background: var(--sat); }
  .grid thead .today { box-shadow: inset 0 -3px 0 var(--amber); }
  .grid .wk-start { border-left: 2px solid #b9bfca; }
  .col-id { width: 46px; }
  .col-serv { width: 280px; }
  .col-local { width: 170px; }
  .col-resp { width: 150px; }
  .grid .sticky-1 { position: sticky; left: 0; z-index: 2; background: #fff; }
  .grid .sticky-2, .grid tbody td.txt.sticky-2 { position: sticky; left: 46px; z-index: 2; background: #fff; box-shadow: 1px 0 0 var(--line); }
  .grid thead .sticky-1, .grid thead .sticky-2 { background: #fafbfc; z-index: 3; }

  .wx { width: 100%; height: 26px; border: 0; background: transparent; font-size: 11px; font-weight: 600; }
  .wx:hover { background: #f0f2f5; }
  .wx.s { background: var(--amber-soft); color: #8a6100; }
  .wx.ch { background: var(--rain-soft); color: var(--rain); }

  .grid tbody tr.rp td { border-bottom-color: var(--line-2); }
  .grid tbody tr.re td { border-bottom: 1px solid #cdd2da; }
  .grid tbody td.txt { text-align: left; padding: 0; position: relative; }
  .grid textarea { width: 100%; height: 64px; border: 0; resize: none; padding: 8px 10px; background: transparent; line-height: 1.3; display: block; }
  .grid textarea:focus, .grid .pin:focus { outline: 2px solid var(--amber); outline-offset: -2px; background: #fffdf5; }
  .grid td.idc { font-weight: 600; color: var(--ink-2); position: relative; }
  .rowtools { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #fff; }
  tr:hover .rowtools, .rowtools:focus-within { display: flex; }
  .rowtools button { border: 0; background: none; width: 26px; height: 18px; border-radius: 4px; color: var(--ink-3); font-size: 12px; line-height: 1; padding: 0; }
  .rowtools button:hover { background: var(--bg); color: var(--ink); }
  .rowtools button.del:hover { color: var(--danger); }
  .readonly .rowtools { display: none !important; }

  .mk { width: 100%; height: 31px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; }
  .mk::after { content: ''; width: 24px; height: 14px; border-radius: 4px; border: 1px dashed transparent; }
  .mk:hover::after { border-color: #c4c9d2; }
  .mk.on.p::after { background: var(--p); border: 0; }
  .mk.on.e::after { background: var(--e); border: 0; }
  .mk:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  .lblp { color: var(--p) !important; }
  .lble { color: var(--e) !important; }

  .pin { width: 100%; height: 31px; border: 0; text-align: center; background: transparent; font-weight: 500; -moz-appearance: textfield; }
  .pin::-webkit-outer-spin-button, .pin::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .pctcell { position: relative; }
  .pctcell::after { content: '%'; position: absolute; right: 7px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--ink-3); pointer-events: none; }
  .pin.lag { color: var(--danger); }
  .avanco { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; display: grid; grid-template-columns: minmax(320px, 1fr) minmax(300px, 460px); gap: 18px; padding: 16px 18px; align-items: center; }
  .av-title { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
  .av-title b, .av-head b { font-size: 12px; letter-spacing: .08em; }
  .av-head { display: flex; gap: 12px; align-items: baseline; grid-column: 1 / -1; }
  .av-row { display: flex; gap: 24px; flex-wrap: wrap; }
  .av-n { display: flex; flex-direction: column; }
  .av-n .k { font-size: 11px; color: var(--ink-3); letter-spacing: .06em; }
  .av-n .v { font-size: 30px; font-weight: 600; line-height: 1.15; }
  .av-n .s { font-size: 12px; color: var(--ink-2); }
  .av-bars { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; max-width: 460px; }
  .av-bars > div { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
  .av-bars .bar { margin: 0; height: 8px; }
  .av-chart { min-width: 0; }
  .av-svg { width: 100%; height: auto; display: block; }
  .av-leg { display: flex; gap: 14px; font-size: 11px; color: var(--ink-2); margin-bottom: 4px; }
  .av-leg i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  @media (max-width: 760px) { .avanco { grid-template-columns: 1fr; } }
  .acth { font-size: 13px; color: var(--danger); line-height: 1.1; }
  .acth span { font-size: 8px; color: var(--ink-3); letter-spacing: .04em; }
  .act { background: #fff; }
  .levar { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #f1c6c2; background: #fff5f4; color: var(--danger); font-size: 14px; }
  .levar:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
  .lev { font-size: 11px; color: var(--ink-3); font-weight: 600; }
  .prio-tag { position: absolute; top: 4px; left: 8px; z-index: 1; display: inline-flex; align-items: center; gap: 4px; background: #fdecea; color: var(--danger); font-size: 10px; font-weight: 600; letter-spacing: .04em; padding: 2px 4px 2px 7px; border-radius: 5px; }
  .prio-tag button { border: 0; background: none; color: inherit; padding: 0 3px; font-size: 13px; line-height: 1; }
  .readonly .prio-tag button { display: none; }
  .grid td.is-prio textarea { padding-top: 24px; }
  .grid tr.prio td.idc { box-shadow: inset 3px 0 0 var(--danger); color: var(--danger); }
  .bulk { color: var(--danger); border-color: #f1c6c2; background: #fff5f4; }
  .bulk:hover { background: #fdecea; }
  #bulk { display: inline-flex; gap: 8px; flex-wrap: wrap; }
  .pend { margin: 0; padding: 10px 18px; background: #fff5f4; border-bottom: 1px solid #f1c6c2; color: #8a2a22; font-size: 13px; }
  .pctv { font-weight: 500; font-size: 13px; background: #fbfbfc; }
  .pctv .prev { color: var(--p); }
  .pctv .ok { color: var(--e); font-weight: 600; }
  .pctv .lag { color: var(--danger); font-weight: 600; }
  .pctv .nil { color: var(--ink-3); }
  .pctv .nprev { color: var(--ink-3); font-size: 10px; }

  .grid-foot { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--ink-3); }

  .empty { max-width: 520px; margin: 60px auto; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 36px 28px; }
  .empty h2 { margin: 0 0 8px; font-weight: 600; font-size: 20px; }
  .empty p { margin: 0 0 20px; color: var(--ink-2); line-height: 1.5; }

  .banner { margin: 12px 20px 0; padding: 10px 14px; border-radius: 8px; background: #fff7e0; border: 1px solid #f5dc9b; color: #6e5300; font-size: 13px; display: none; }
  .banner.show { display: block; }

  dialog { border: 0; border-radius: 14px; padding: 0; width: min(440px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(20,24,31,.45); }
  .dlg { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .dlg h3 { margin: 0; font-size: 18px; font-weight: 600; }
  .dlg p { margin: 0; color: var(--ink-2); line-height: 1.45; }
  .dlg .input { width: 100%; min-width: 0; }
  .dlg .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .check { display: flex; gap: 8px; align-items: flex-start; color: var(--ink-2); line-height: 1.4; }
  .check input { margin-top: 3px; accent-color: var(--amber); }
  .err { color: var(--danger); font-size: 12px; min-height: 0; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--head); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: .2s; pointer-events: none; z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 760px) {
    .topbar, .toolbar, main { padding-left: 12px; padding-right: 12px; }
    select, .input { min-width: 0; width: 100%; }
    .toolbar .field { flex: 1 1 100%; }
    .sheet-info { grid-template-columns: 1fr; }
    .kpis { flex-wrap: wrap; }
    .kpi { flex: 1; min-width: 130px; }
  }

/* restrições */
.resth { font-size: 9px; letter-spacing: .04em; line-height: 1.2; }
.rest { background: #fff; padding: 2px !important; }
.rbtn { width: 100%; min-height: 56px; border: 1px dashed transparent; background: none; border-radius: 6px; display: flex; flex-wrap: wrap; gap: 3px; align-items: center; justify-content: center; color: var(--ink-3); font-size: 13px; padding: 3px; }
.rbtn:hover { border-color: #c4c9d2; background: #fafbfc; }
.rbtn.falta { border-color: #f1c6c2; color: var(--danger); font-size: 11px; font-weight: 600; background: #fff8f7; }
.rchip { background: #fdecea; color: var(--danger); font-weight: 600; font-size: 11px; padding: 2px 5px; border-radius: 4px; }
.kres { color: var(--danger) !important; font-weight: 500; }
dialog.largo { width: min(640px, calc(100vw - 32px)); }
.rlist { max-height: 52vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }
.rg { border: 0; padding: 6px 0; margin: 0; }
.rg legend { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 0; }
.ri { display: grid; grid-template-columns: 18px 28px 1fr; gap: 6px; align-items: start; padding: 5px 2px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.ri:hover { background: var(--bg); }
.ri input { margin-top: 2px; accent-color: var(--danger); }
.ri b { color: var(--danger); }
.ri[hidden], .rg[hidden] { display: none; }
</style>

</head>
<body>
  <div class="topbar">
    <div class="brand"><div class="mark">PCP</div><div>Planejamento e Controle Semanal<small>Tarefas por obra · previsto × executado · versão 3 (restrições + Google Drive)</small></div></div>
    <div class="status" id="status"><span class="dot"></span><span id="statusTxt">Conectando…</span></div>
  </div>

  <div class="toolbar" id="toolbar">
    <div class="field">
      <label for="selObra">Obra</label>
      <select id="selObra"></select>
    </div>
    <button class="btn" id="btnNovaObra" data-w>+ Nova obra</button>
    <div class="field">
      <label for="selPlano">Planejamento (2 semanas)</label>
      <select id="selPlano"></select>
    </div>
    <button class="btn primary" id="btnNovoPlano" data-w>+ Novo planejamento</button>
    <div class="spacer"></div>
    <button class="btn dark" id="btnPdf">⎙ Imprimir (PDF A4)</button>
    <button class="btn" id="btnExport">⤓ Excel</button>
    <div class="menu-wrap">
      <button class="btn" id="btnMenu" aria-label="Mais opções">⋯</button>
      <div class="menu" id="menu">
        <button id="mRenomear" data-w>Editar obra (nome e término)</button>
        <hr>
        <button id="mDrive">Salvar no Google Drive…</button>
        <hr>
        <button id="mBackup">Fazer backup (arquivo .json)</button>
        <button id="mImportar">Importar backup…</button>
        <hr>
        <button id="mExcluirPlano" class="danger" data-w>Excluir este planejamento</button>
        <button id="mExcluirObra" class="danger" data-w>Excluir obra e seus planejamentos</button>
      </div>
    </div>
  </div>

  <div class="banner" id="banner"></div>
  <main id="main"></main>

  <dialog id="dlg"><form class="dlg" id="dlgForm" method="dialog"></form></dialog>
  <div class="toast" id="toast"></div>
  <input type="file" id="inpImportar" accept=".json,application/json" hidden>

function restricoesDe(t, w) { return (t.rest && t.rest[w]) || []; }

function _segunda(d) { const x = new Date(d); x.setHours(12, 0, 0, 0); const wd = x.getDay(); x.setDate(x.getDate() - (wd === 0 ? 6 : wd - 1)); return x; }
function _parse(s) { return new Date(s + 'T12:00:00'); }
function _dia(inicio, n) { const d = _parse(inicio); d.setDate(d.getDate() + n); return d; }

// Número da semana em contagem regressiva até o término da obra.
// A semana que contém a data de término é a SEMANA 1; a anterior, SEMANA 2, e assim por diante.
function numSemana(inicioPlano, w, termino) {
  if (!termino) return null;
  const seg = _dia(inicioPlano, w * 7);
  return Math.round((_segunda(_parse(termino)) - _segunda(seg)) / 864e5 / 7) + 1;
}
function rotuloNumSemana(inicioPlano, w, termino) {
  const n = numSemana(inicioPlano, w, termino);
  if (n == null) return 'SEMANA ' + (w + 1);
  if (n >= 1) return 'SEMANA ' + n;
  return 'APÓS TÉRMINO +' + (1 - n);
}

// % previsto e % realizado de cada serviço, acumulados ao longo das duas semanas do planejamento.
// Base = total de dias previstos (P) do serviço no planejamento.
//   previsto[w]  = dias P até a semana w ÷ total de dias P
//   realizado[w] = dias E até a semana w ÷ total de dias P (limitado a 100%)
function calcTarefa(t) {
  const nP = [0, 1].map(w => t.w[w].p.filter(Boolean).length);
  const nE = [0, 1].map(w => t.w[w].e.filter(Boolean).length);
  const totP = nP[0] + nP[1];
  const r = { nP, nE, totP, previsto: [null, null], realizado: [null, null], concluida: [null, null], semPrevisao: false };
  if (!totP) { r.semPrevisao = nE[0] + nE[1] > 0; return r; }
  let accP = 0, accE = 0;
  for (let w = 0; w < 2; w++) {
    accP += nP[w]; accE += nE[w];
    r.previsto[w] = Math.round(accP / totP * 100);
    r.realizado[w] = Math.min(100, Math.round(accE / totP * 100));
    if (nP[w]) r.concluida[w] = r.realizado[w] >= r.previsto[w];
  }
  return r;
}
// Resumo por semana: serviços previstos, realizados e percentual (PPC); dias previstos e executados.
function resumoSemana(tarefas, w) {
  let prev = 0, ok = 0, diasP = 0, diasOk = 0;
  for (const t of tarefas) {
    if (!t.w[w].p.some(Boolean)) continue;
    prev++;
    const c = calcTarefa(t);
    if (c.concluida[w]) ok++;
    t.w[w].p.forEach((v, i) => { if (v) { diasP++; if (t.w[w].e[i]) diasOk++; } });
  }
  return { prev, ok, pct: prev ? Math.round(ok / prev * 100) : null, diasP, diasOk, pctDias: diasP ? Math.round(diasOk / diasP * 100) : null };
}

// Avanço da obra inteira: soma os dias P e E de todos os planejamentos, semana a semana.
// Cada semana conta uma vez só: vale o planejamento em que ela é a semana 1 (o mais recente);
// se não houver, o planejamento anterior, em que ela é a semana 2.
//   % planejado = dias previstos até hoje ÷ total de dias previstos da obra
//   % executado = dias executados até hoje ÷ total de dias previstos da obra
function avancoObra(planos, hojeIso) {
  const pad = n => String(n).padStart(2, '0');
  const isoD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const mapa = new Map();
  for (const pl of planos) {
    if (!pl || !pl.inicio) continue;
    for (let w = 0; w < 2; w++) {
      const seg = isoD(_dia(pl.inicio, w * 7));
      const atual = mapa.get(seg);
      if (!atual || (w === 0 && atual.w === 1)) mapa.set(seg, { pl, w });
    }
  }
  const semanas = [...mapa.keys()].sort().map(seg => {
    const { pl, w } = mapa.get(seg);
    let p = 0, e = 0, pHoje = 0, eHoje = 0;
    for (const t of pl.tarefas || []) {
      const sw = t.w && t.w[w]; if (!sw) continue;
      for (let i = 0; i < 6; i++) {
        const dIso = isoD(_dia(seg, i));
        if (sw.p && sw.p[i]) { p++; if (dIso <= hojeIso) pHoje++; }
        if (sw.e && sw.e[i]) { e++; if (dIso <= hojeIso) eHoje++; }
      }
    }
    return { seg, p, e, pHoje, eHoje };
  });
  const totP = semanas.reduce((a, x) => a + x.p, 0);
  let accP = 0, accE = 0;
  for (const x of semanas) { accP += x.p; accE += x.e; x.pAc = totP ? Math.round(accP / totP * 100) : 0; x.eAc = totP ? Math.min(100, Math.round(accE / totP * 100)) : 0; }
  const pH = semanas.reduce((a, x) => a + x.pHoje, 0), eH = semanas.reduce((a, x) => a + x.eHoje, 0);
  const pctPlan = totP ? Math.round(pH / totP * 100) : null;
  const pctExec = totP ? Math.min(100, Math.round(eH / totP * 100)) : null;
  return { semanas, totP, diasPlanHoje: pH, diasExecHoje: eH, pctPlan, pctExec, desvio: totP ? pctExec - pctPlan : null };
}

function _periodo(inicio) {
  const MESES = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
  const p2 = n => String(n).padStart(2, '0');
  const ini = _parse(inicio), fim = _dia(inicio, 12);
  if (ini.getMonth() === fim.getMonth()) return `${p2(ini.getDate())} À ${p2(fim.getDate())} DE ${MESES[ini.getMonth()]} DE ${ini.getFullYear()}`;
  return `${p2(ini.getDate())}/${p2(ini.getMonth()+1)} À ${p2(fim.getDate())}/${p2(fim.getMonth()+1)} DE ${fim.getFullYear()}`;
}
function _dataBR(s) { if (!s) return ''; const d = _parse(s); return d.toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' }); }

// ---------- Excel: preenche o modelo original, A4 retrato ----------
async function preencherModelo(ExcelJS, modeloBuf, plano, obra) {
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(modeloBuf);
  const ws = wb.worksheets[0];
  const tarefas = plano.tarefas || [];

  ws.getCell('B3').value = 'OBRA: ' + (obra.nome || '').toUpperCase();
  ws.getCell('B5').value = 'SEMANA DE: ' + _periodo(plano.inicio);
  for (const a of ['B3', 'B5']) { const c = ws.getCell(a); c.style = Object.assign({}, c.style, { alignment: Object.assign({}, c.style.alignment, { shrinkToFit: true }) }); }
  if (obra.termino) {
    const c = ws.getCell('C3'); c.value = 'TÉRMINO DA OBRA: ' + _dataBR(obra.termino);
    c.style = Object.assign({}, c.style, { font: { name: 'Arial', bold: true, size: 11 }, alignment: { horizontal: 'left' } });
  }
  if (obra.avanco && obra.avanco.pctPlan != null) {
    const c = ws.getCell('C5');
    c.value = `AVANÇO DA OBRA — PLANEJADO: ${obra.avanco.pctPlan}%  ·  EXECUTADO: ${obra.avanco.pctExec}%`;
    c.style = Object.assign({}, c.style, { font: { name: 'Arial', bold: true, size: 11, color: { argb: obra.avanco.pctExec < obra.avanco.pctPlan ? 'FFC23B30' : 'FF23905A' } }, alignment: { horizontal: 'left' } });
  }
  ws.getCell('E7').value = rotuloNumSemana(plano.inicio, 0, obra.termino);
  ws.getCell('M7').value = rotuloNumSemana(plano.inicio, 1, obra.termino);
  {
    try { ws.mergeCells('U7:U13'); } catch (e) {}
    const c = ws.getCell('U7'); c.value = 'RESTRIÇÕES';
    const borda = { style: 'thin', color: { argb: 'FF000000' } };
    c.style = { font: { name: 'Arial', bold: true, size: 10 }, alignment: { horizontal: 'center', vertical: 'middle', textRotation: 90 }, border: { top: borda, bottom: borda, left: borda, right: borda } };
  }

  const colsSem = [[6,7,8,9,10,11],[14,15,16,17,18,19]]; // F..K, N..S
  const colPct = [12, 20]; // L, T
  const corP = 'FFBDD7EE', corE = 'FFC6EFCE';
  const setStyle = (cell, extra) => { cell.style = Object.assign({}, cell.style, extra); };

  for (let w = 0; w < 2; w++) {
    for (let i = 0; i < 6; i++) {
      ws.getCell(13, colsSem[w][i]).value = _dia(plano.inicio, w * 7 + i).getDate();
      const t = (plano.tempo && plano.tempo['w' + w]) || { m: [], t: [] };
      ws.getCell(10, colsSem[w][i]).value = t.m[i] || null;
      ws.getCell(11, colsSem[w][i]).value = t.t[i] || null;
    }
  }

  const total = Math.max(15, tarefas.length);
  for (let k = 0; k < total; k++) {
    const r = 14 + k * 2;
    if (k >= 15) {
      for (let c = 1; c <= 21; c++) {
        ws.getCell(r, c).style = JSON.parse(JSON.stringify(ws.getCell(42, c).style || {}));
        ws.getCell(r + 1, c).style = JSON.parse(JSON.stringify(ws.getCell(43, c).style || {}));
      }
      ws.getRow(r).height = ws.getRow(42).height;
      ws.getRow(r + 1).height = ws.getRow(43).height;
      for (const c of ['A','B','C','D']) ws.mergeCells(`${c}${r}:${c}${r+1}`);
      ws.getCell(r, 5).value = 'P'; ws.getCell(r + 1, 5).value = 'E';
      ws.getCell(r, 13).value = 'P'; ws.getCell(r + 1, 13).value = 'E';
    }
    const t = tarefas[k];
    ws.getCell(r, 1).value = k + 1;
    ws.getCell(r, 2).value = t ? (((t.prio && (t.prio[0] || t.prio[1])) ? '[PRIORIDADE] ' : '') + (t.servico || '')) || null : null;
    ws.getCell(r, 3).value = t ? (t.local || null) : null;
    ws.getCell(r, 4).value = t ? (t.responsavel || null) : null;
    {
      const cR = ws.getCell(r, 21), cR2 = ws.getCell(r + 1, 21);
      const txt = t ? [0, 1].map(w => restricoesDe(t, w).length ? `${rotuloNumSemana(plano.inicio, w, obra.termino).replace('SEMANA ', 'S')}: ${restricoesDe(t, w).join(', ')}` : '').filter(Boolean).join('\n') : '';
      try { ws.mergeCells(`U${r}:U${r+1}`); } catch (e) {}
      cR.value = txt || null;
      const borda = { style: 'thin', color: { argb: 'FF000000' } };
      for (const c of [cR, cR2]) c.style = { font: { name: 'Arial', size: 9, bold: true, color: { argb: 'FFC23B30' } }, alignment: { horizontal: 'center', vertical: 'middle', wrapText: true }, border: { top: borda, bottom: borda, left: borda, right: borda } };
    }
    for (let c = 1; c <= 4; c++) {
      const cell = ws.getCell(r, c);
      setStyle(cell, { alignment: Object.assign({}, cell.style.alignment, { vertical: 'middle', wrapText: c > 1 }) });
    }
    const calc = t ? calcTarefa(t) : null;
    for (let w = 0; w < 2; w++) {
      const sw = t && t.w && t.w[w];
      for (let i = 0; i < 6; i++) {
        for (const [lin, chave, cor] of [[r, 'p', corP], [r + 1, 'e', corE]]) {
          const cell = ws.getCell(lin, colsSem[w][i]);
          if (sw && sw[chave] && sw[chave][i]) {
            cell.value = 'X';
            setStyle(cell, { fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: cor } } });
          } else cell.value = null;
        }
      }
      const cP = ws.getCell(r, colPct[w]), cE = ws.getCell(r + 1, colPct[w]);
      const pp = calc && calc.previsto[w] != null ? calc.previsto[w] / 100 : null;
      const pe = calc && calc.realizado[w] != null ? calc.realizado[w] / 100 : null;
      cP.value = pp; cE.value = pe;
      if (pp != null) cP.numFmt = '0%';
      if (pe != null) cE.numFmt = '0%';
      if (pp != null && pe != null && pe < pp) setStyle(cE, { font: Object.assign({}, cE.style.font, { color: { argb: 'FFC23B30' } }) });
    }
  }

  // Resumo abaixo da grade
  const rr = 14 + total * 2 + 1;
  const s0 = resumoSemana(tarefas, 0), s1 = resumoSemana(tarefas, 1);
  const txt = (s, w) => `${rotuloNumSemana(plano.inicio, w, obra.termino)}: ${s.prev} serviço(s) previsto(s), ${s.ok} realizado(s)` + (s.pct != null ? ` — ${s.pct}%` : '');
  ws.getCell(rr, 2).value = 'RESUMO — ' + txt(s0, 0);
  ws.getCell(rr + 1, 2).value = 'RESUMO — ' + txt(s1, 1);
  for (const x of [rr, rr + 1]) setStyle(ws.getCell(x, 2), { font: { name: 'Arial', bold: true, size: 11 }, alignment: { horizontal: 'left' } });

  // Fonte Outfit em toda a planilha
  // legenda das restrições usadas
  const usadas = [...new Set(tarefas.flatMap(t => [0, 1].flatMap(w => restricoesDe(t, w))))].sort();
  let rLeg = rr + 2;
  if (usadas.length) {
    ws.getCell(rLeg, 2).value = 'RESTRIÇÕES APONTADAS:';
    ws.getCell(rLeg, 2).style = { font: { name: 'Arial', bold: true, size: 10 } };
    for (const c of usadas) { rLeg++; ws.getCell(rLeg, 2).value = `${c} – ${(RESTR_MAPA[c] && RESTR_MAPA[c].desc || '').toUpperCase()}`; ws.getCell(rLeg, 2).style = { font: { name: 'Arial', size: 9 } }; }
  }
  for (let r = 1; r <= rLeg; r++) for (let c = 1; c <= 21; c++) {
    const cell = ws.getCell(r, c);
    const f = cell.style && cell.style.font;
    if (cell.value != null || f) setStyle(cell, { font: Object.assign({}, f || {}, { name: 'Outfit' }) });
  }

  // A4 retrato, uma página de largura
  ws.getColumn(2).width = 44; ws.getColumn(3).width = 22; ws.getColumn(4).width = 17; ws.getColumn(12).width = 7.5; ws.getColumn(20).width = 7.5; ws.getColumn(21).width = 12;
  ws.pageSetup.printArea = `A1:U${rLeg}`;
  ws.pageSetup.orientation = 'portrait';
  ws.pageSetup.paperSize = 9;
  ws.pageSetup.fitToPage = true;
  ws.pageSetup.fitToWidth = 1;
  ws.pageSetup.fitToHeight = 0;
  ws.pageSetup.horizontalCentered = true;
  ws.pageSetup.margins = { left: 0.3, right: 0.3, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 };
  ws.pageSetup.printTitlesRow = '7:13';
  return wb.xlsx.writeBuffer();
}

// ---------- PDF: A4 retrato, pronto para imprimir ----------

    doc.addFileToVFS('Outfit-SemiBold.ttf', fontes.bold); doc.addFont('Outfit-SemiBold.ttf', 'Outfit', 'bold');

  }

  function cabecalho() {

      font(8, true, obra.avanco.pctExec < obra.avanco.pctPlan ? [194, 59, 48] : CE); doc.text(`Exec. ${obra.avanco.pctExec}%`, 172, y + 9.5);
    }

    doc.text('S = SOL     CH = CHUVA', M + 22, y);

      font(13, true, cor); doc.text(s.pct == null ? '–' : s.pct + '%', x + wBox - 3, y + 7.6, { align: 'right' });
      font(5.5, false, [130, 136, 150]); doc.text('realizado', x + wBox - 3, y + 2.8, { align: 'right' });
    });

  }

  function cabecalhoTabela(y) {
    const h = [6, 4, 4, 6]; // semana, tempo M, tempo T, dias
    const yTop = y, hTot = h[0] + h[1] + h[2] + h[3];

    font(7, true);

        if (i === 5) rect(xd, yy, cDia, h[3], SAT);
        const d = _dia(plano.inicio, w * 7 + i);
        font(5, true, [110, 116, 130]); centro(DIAS[i], xd, cDia, yy + 2.2);
        font(6.5, true); centro(d.getDate(), xd, cDia, yy + 5.2);
        linha(xd, yy, xd, yy + h[3]);

    }
    // contorno e divisões verticais principais
    for (const x of [x0, xServ, xLocal, xResp, xSem[0], xSem[1], xEnd]) linha(x, yTop, x, yTop + hTot, x >= xSem[0] ? [90, 96, 110] : GRID, x >= xSem[0] ? 0.35 : 0.15);

      });

      const xr = xs + cLbl + 6 * cDia + cPct, rs = restricoesDe(t, w);

  const colW = (W - 2 * M) / 3, lh = 2.55;

  if (y + 4 + hLeg > limite) { rodape(); doc.addPage(); pagina++; y = M; } else y += 4;
  font(7, true); doc.text('RESTRIÇÕES — códigos para justificar desvios no planejamento' + (usadas.size ? ' (em vermelho: apontadas nesta folha)' : ''), M, y + 3);

  cols.forEach((col, ci) => {

    for (const { g } of col) {

      for (const [c, d] of g.itens) {
        const u = usadas.has(c);
        font(5.4, true, u ? [194, 59, 48] : INK); doc.text(c, x, yy + 1.8);

        const dd = doc.splitTextToSize(d, colW - 7)[0];

      }

    }
  });
  y = yL + Math.max(...alt);

  // assinaturas
  if (y + 18 > limite) { rodape(); doc.addPage(); pagina++; y = M; }

  const atras = kk === 'e' && c.previsto[w] != null && v < c.previsto[w];
  const ok = kk === 'e' && !atras && c.nP[w] > 0;

}
function atualizarPct(k) {

}

function htmlAct(t, k, w) {

const normTxt = x => (x || '').trim().toLowerCase();
const tarefaVazia = x => !(x.servico || x.local || x.responsavel).trim() && !x.w.some(s => s.p.some(Boolean) || s.e.some(Boolean));
// Insere/atualiza a tarefa como prioridade na semana tw de um planejamento.
function aplicarPrioridade(plano, tw, item, mesmaTarefaId) {
  let t = mesmaTarefaId ? plano.tarefas.find(x => x.id === mesmaTarefaId)
                        : plano.tarefas.find(x => normTxt(x.servico) && normTxt(x.servico) === normTxt(item.servico) && normTxt(x.local) === normTxt(item.local));
  if (!t) {
    t = novaTarefa(); t.servico = item.servico; t.local = item.local; t.responsavel = item.responsavel;
    let pos = 0; while (pos < plano.tarefas.length && plano.tarefas[pos].prio[tw]) pos++;
    plano.tarefas.splice(pos, 0, t);
    const iv = plano.tarefas.length > 15 ? plano.tarefas.map((x, i) => tarefaVazia(x) ? i : -1).filter(i => i >= 0).pop() : undefined;
    if (iv !== undefined) plano.tarefas.splice(iv, 1);
  }
  t.prio[tw] = 1;
  let n = item.dias;
  for (let i = 0; i < 6 && n > 0; i++) if (!t.w[tw].p[i]) { t.w[tw].p[i] = 1; n--; }
}
async function levar(lista) {
  if (!S.plano || !lista.length) return;
  const obra = obraAtual(); const externos = new Map(); const pend = [];
  let qtd = 0;
  for (const { k, w } of lista) {
    const t = S.plano.tarefas[k]; if (!t || t.lev[w] || !pendente(t, w)) continue;
    const s = t.w[w];
    const dias = Math.max(1, s.p.filter((v, i) => v && !s.e[i]).length);
    const item = { servico: t.servico, local: t.local, responsavel: t.responsavel, dias };
    const alvo = semanaAlvo(w);
    if (w === 0) aplicarPrioridade(S.plano, 1, item, t.id);
    else {
      // planejamento que contém a semana-alvo: começa nela (semana 1) ou uma semana antes (semana 2)
      const pa = S.planos.find(p => p.inicio === alvo) || S.planos.find(p => p.inicio === iso(addDias(alvo, -7)));
      if (pa) {
        if (!externos.has(pa.id)) externos.set(pa.id, normalizaPlano(clone(pa)));
        const pl = externos.get(pa.id); aplicarPrioridade(pl, pl.inicio === alvo ? 0 : 1, item);
      } else pend.push({ id: uid(), ...item, alvo, origem: S.plano.inicio });
    }
    t.lev[w] = rotuloData(alvo); qtd++;
  }
  if (!qtd) return;
  agendarSalvar(); // marca como alterado antes de salvar outros documentos, para a atualização remota não sobrescrever
  try {
    for (const [id, pl] of externos) { const d = clone(pl); delete d.id; d.atualizadoEm = new Date().toISOString(); await S.store.salvarPlano(id, d); const ix = S.planos.findIndex(p => p.id === id); if (ix >= 0) S.planos[ix] = { id, ...d }; }
    if (pend.length && obra) { const dados = { ...stripId(obra), pendencias: [...(obra.pendencias || []), ...pend] }; await S.store.salvarObra(obra.id, dados); obra.pendencias = dados.pendencias; }
  } catch (e) { toast('Não foi possível salvar no planejamento seguinte (' + ((e && e.code) || 'erro') + ').'); }
  agendarSalvar(); render();
  toast(qtd + ' serviço(s) levado(s) como prioridade' + (pend.length ? ' — entram quando o próximo planejamento for criado' : ''));
}
function ppc_antigo(w) {
  const tarefas = S.plano.tarefas.filter(t => (t.servico || '').trim() && (t.w[w].p.some(Boolean) || t.w[w].pp !== ''));
  const concluida = t => {
    const s = t.w[w];
    if (s.pp !== '' && s.pe !== '') return Number(s.pe) >= Number(s.pp);
    if (s.pe !== '' && Number(s.pe) >= 100) return true;
    if (s.p.some(Boolean)) return s.p.every((v, i) => !v || s.e[i]);
    return false;
  };
  const ok = tarefas.filter(concluida).length;
  return { total: tarefas.length, ok, pct: tarefas.length ? Math.round(ok / tarefas.length * 100) : null };
}

function dlgNovoPlano() {
  if (!S.obraId) return;
  if (S.sujo) salvarAgora();
  const ant = S.planos[0] && S.planos[0].id === S.planoId && S.plano ? { ...clone(S.plano), id: S.planoId } : S.planos[0];
  const sugestao = ant ? iso(addDias(ant.inicio, 7)) : segundaDe(new Date());
  dialogo(`<h3>Novo planejamento</h3><p>Duas semanas, de segunda a sábado. Escolha a data de início (a segunda-feira da semana 1).</p>
    <input class="input" type="date" name="inicio" value="${sugestao}" required>
    ${ant ? `<label class="check"><input type="checkbox" name="copiar" checked><span>Trazer os serviços do planejamento anterior (${esc(rotuloPeriodo(ant.inicio))}), com a <b>semana 2</b> dele virando a <b>semana 1</b> deste.</span></label>` : ''}
    <div class="row"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn primary" value="ok">Criar</button></div>`,
    async (f) => {
      const inicio = segundaDe(parse(f.inicio.value));
      if (S.planos.some(p => p.inicio === inicio)) { $('#dlgErr').textContent = 'Já existe um planejamento começando em ' + parse(inicio).toLocaleDateString('pt-BR') + '.'; return false; }
      let tarefas;
      if (ant && f.copiar && f.copiar.checked) {
        const base = normalizaPlano(clone(ant));
        const desloc = Math.round((parse(inicio) - parse(base.inicio)) / 864e5);
        tarefas = base.tarefas.map(t => {
          const n = novaTarefa(); n.servico = t.servico; n.local = t.local; n.responsavel = t.responsavel;
          if (desloc === 7) { n.w[0] = { p: [...t.w[1].p], e: vazio6(), pp: '', pe: '' }; n.prio[0] = t.prio[1]; }
          return n;
        });
        while (tarefas.length < 15) tarefas.push(novaTarefa());
      } else tarefas = Array.from({ length: 15 }, novaTarefa);
      const id = uid();
      const dados = { obraId: S.obraId, inicio, tempo: novoTempo(), tarefas, criadoEm: new Date().toISOString(), atualizadoEm: new Date().toISOString() };
      const obra = obraAtual(), seg2 = iso(addDias(inicio, 7));
      const usar = (obra?.pendencias || []).filter(p => p.alvo <= seg2);
      if (usar.length) {
        dados.tarefas = dados.tarefas.map(t => normalizaPlano({ tarefas: [t] }).tarefas[0]);
        // ordem original: aplica do último para o primeiro, para manter a sequência no topo
        for (const p of usar.slice().reverse()) aplicarPrioridade(dados, p.alvo <= inicio ? 0 : 1, p);
        const resto = obra.pendencias.filter(p => !usar.includes(p));
        await S.store.salvarObra(obra.id, { ...stripId(obra), pendencias: resto }); obra.pendencias = resto;
      }
      await S.store.salvarPlano(id, dados);
      S.planos = [{ id, ...clone(dados) }, ...S.planos.filter(p => p.id !== id)].sort((a, b) => b.inicio.localeCompare(a.inicio));
      abrirPlano(id); toast('Planejamento criado');
    });
}

async function carregarFontes() {
  if (carregarFontes.cache) return carregarFontes.cache;
  const bin = async (url) => { const u8 = new Uint8Array(await (await fetch(url)).arrayBuffer()); let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return s; };
  const [regular, bold] = await Promise.all([bin(ARQUIVOS['assets/fonts/Outfit-Regular.ttf']), bin(ARQUIVOS['assets/fonts/Outfit-SemiBold.ttf'])]);
  return (carregarFontes.cache = { regular, bold });
}
function baixar(nome, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function carregarScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function exportar() {

      catch (e) { await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'); }
    }
    const buf = new Uint8Array(await (await fetch(ARQUIVOS['assets/modelo-pcp.xlsx'])).arrayBuffer());
    const out = await preencherModelo(window.ExcelJS, buf.buffer, S.plano, obraComAvanco());
    const nome = `PCP - ${(obraAtual()?.nome || 'obra').replace(/[\\/:*?"<>|]/g, '')} - ${S.plano.inicio}.xlsx`;
    baixar(nome, new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })); toast('Arquivo gerado: ' + nome);
  } catch (e) { toast('Falha ao gerar a planilha.'); console.error(e); }

    S.syncInfo = i; statusSync();
    const m = $('#mDrive'); if (m) m.textContent = i.cfg ? 'Google Drive: conectado ✓' : 'Salvar no Google Drive…';
    if (i.cfg && i.estado === 'erro') banner('Não foi possível sincronizar com o Google Drive: ' + i.erro + ' — as alterações ficam guardadas neste aparelho e serão enviadas depois.');
    else if (i.cfg) banner('');
  });
  statusSync();
  const mh = location.hash.match(/^#drive=(.+)$/);
  if (mh) {
    history.replaceState(null, '', location.pathname + location.search);
    const c = decodificarCfg(mh[1]);
    if (c && !(S.store.drive.cfg && S.store.drive.cfg.url === c.url)) dlgDrive(c);
  }
  setTimeout(avisoBackup, 800);
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
